schema_version: "1.0"
name: "triggering-corpus-flow-adversarial"
description: "Does corpus-flow load for this adversarial prompt?"
tags: ["triggering", "corpus-flow", "adversarial"]
execution:
  prompt: "Brief 03 is in done/ but we changed our minds about the approach. Just edit it to describe the new approach."
  max_turns: 3
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Glob, Grep]
runs: 3
graders:
  - type: tool_used
    name: "right-skill-loaded"
    tool: "Skill"
    input_match: "corpus-flow"
    min: 1
