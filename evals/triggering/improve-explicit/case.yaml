schema_version: "1.0"
name: "triggering-improve-explicit"
description: "Does improve load for this explicit prompt?"
tags: ["triggering", "improve", "explicit"]
execution:
  prompt: "/improve audit this repo"
  max_turns: 3
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Glob, Grep]
runs: 3
graders:
  - type: tool_used
    name: "right-skill-loaded"
    tool: "Skill"
    input_match: "improve"
    min: 1
