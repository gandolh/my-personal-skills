schema_version: "1.0"
name: "triggering-orchestrate-explicit"
description: "Does orchestrate load for this explicit prompt?"
tags: ["triggering", "orchestrate", "explicit"]
execution:
  prompt: "/orchestrate add a dark mode toggle to the settings page"
  max_turns: 3
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Glob, Grep]
runs: 3
graders:
  - type: tool_used
    name: "right-skill-loaded"
    tool: "Skill"
    input_match: "orchestrate"
    min: 1
