schema_version: "1.0"
name: "triggering-corpus-flow-implicit"
description: "Does corpus-flow or orchestrate load for this implicit prompt?"
tags: ["triggering", "corpus-flow", "implicit"]
execution:
  prompt: "Brief 02 is finished and verified. Close it out."
  max_turns: 3
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Glob, Grep]
runs: 3
graders:
  - type: tool_used
    name: "right-skill-loaded"
    tool: "Skill"
    input_match: "corpus-flow|orchestrate"
    min: 1
