schema_version: "1.0"
name: "triggering-corpus-flow-explicit"
description: "Does corpus-flow load for this explicit prompt?"
tags: ["triggering", "corpus-flow", "explicit"]
execution:
  prompt: "Use corpus-flow to promote the todo \"cache-the-export-query\" to a brief."
  max_turns: 3
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Glob, Grep]
runs: 3
graders:
  - type: tool_used
    name: "right-skill-loaded"
    tool: "Skill"
    input_match: "corpus-flow"
    min: 1
